name: Stage 3.3 generate usage migration

on:
  push:
    branches:
      - feat/stage3-usage-schema-foundation
    paths:
      - ".github/workflows/stage3-generate-usage-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage3-usage-schema-foundation

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Inspect migration command
        run: |
          # Confirm the CLI command contract before creating a migration file.
          npx --yes supabase@2.118.0 migration --help

      - name: Generate migration
        run: |
          # Generate the canonical timestamped migration filename.
          npx --yes supabase@2.118.0 migration new stage3_usage_metadata

      - name: Commit generated migration
        run: |
          # Commit only the CLI-generated migration path; SQL is filled in separately.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/
          git diff --cached --check
          git commit -m "chore(db): generate Stage 3.3 usage migration"
          git push origin HEAD:feat/stage3-usage-schema-foundation
