name: Stage 3.3 usage contract validation

on:
  push:
    branches:
      - feat/stage3-usage-event-contract
    paths:
      - "src/lib/server/openrouter-usage.ts"
      - "src/lib/server/openrouter-usage.test.ts"
      - ".project/**"
      - ".github/workflows/stage3-usage-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
      OPENROUTER_API_KEY: sk-or-v1-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ENV_CHECK_CI_ALLOW_IN_MEMORY_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Project state and docs
        run: |
          # Validate project state and canonical docs.
          npm run state:check
          npm run docs:check
      - name: Smoke
        env:
          ALLOW_DEGRADED: "1"
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: |
          # Start the built application before smoke checks.
          npm run start > /tmp/new-era-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -sS http://127.0.0.1:3000/api/health > /tmp/new-era-health.json; then
              break
            fi
            sleep 2
          done
          npm run smoke
