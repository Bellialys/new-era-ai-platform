name: Stage 3 KMS dependency install

on:
  push:
    branches:
      - feat/stage3-kms-dependencies
    paths:
      - ".github/workflows/stage3-kms-dependency-install.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: feat/stage3-kms-dependencies

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install pinned KMS dependencies
        run: |
          # Install only the two reviewed runtime dependencies and pin exact versions.
          npm install --save-exact @aws-sdk/client-kms @vercel/oidc-aws-credentials-provider

      - name: Commit dependency files
        run: |
          # Commit package metadata generated by npm so package-lock stays authoritative.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "build(stage3): add KMS OIDC dependencies"
          git push origin HEAD:feat/stage3-kms-dependencies
