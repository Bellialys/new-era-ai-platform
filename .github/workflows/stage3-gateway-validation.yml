name: Stage 3.3 gateway validation

on:
  push:
    branches:
      - feat/stage3-unified-gateway-foundation
    paths:
      - "src/lib/server/openrouter.ts"
      - "src/lib/server/openrouter-gateway.ts"
      - "src/lib/server/openrouter-gateway.test.ts"
      - ".project/**"
      - ".github/workflows/stage3-gateway-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Project state and docs
        run: |
          # Validate project task state and canonical documentation sync.
          npm run state:check
          npm run docs:check
      - name: Smoke
        run: npm run smoke
