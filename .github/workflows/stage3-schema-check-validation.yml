name: Stage 3 schema checker validation

on:
  push:
    branches:
      - chore/stage3-schema-sync-coverage
    paths:
      - "scripts/check-schema-sync.mjs"
      - ".github/workflows/stage3-schema-check-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check script syntax
        run: |
          # Parse the production schema checker without executing a DB connection.
          node --check scripts/check-schema-sync.mjs
      - name: Check CLI contract
        run: |
          # Exercise the no-secret help path.
          npm run schema:check -- --help
