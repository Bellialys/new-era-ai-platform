name: Stage 3 migration name probe

on:
  push:
    branches:
      - ops/stage3-supabase-migration-name
    paths:
      - ".github/workflows/stage3-migration-name.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate migration filename
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generate with Supabase CLI
        run: |
          npx --yes supabase@latest --version
          npx --yes supabase@latest migration new stage3_provider_credentials
          find supabase/migrations -maxdepth 1 -type f -name '*stage3_provider_credentials.sql' -printf '%f\n'
