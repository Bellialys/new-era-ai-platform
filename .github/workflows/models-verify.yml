name: OpenRouter model catalog verification

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Validate only catalog-affecting changes on PRs and main.
  # Keep nightly scheduled verification for provider-side churn.
  push:
    branches: [main]
    paths:
      - "src/lib/server/models.ts"
      - "src/lib/arena/constants.ts"
      - "src/lib/arena/team-mode.ts"
      - "src/lib/arena/image-models.ts"
      - "scripts/verify-models.mjs"
      - ".github/workflows/models-verify.yml"
  pull_request:
    paths:
      - "src/lib/server/models.ts"
      - "src/lib/arena/constants.ts"
      - "src/lib/arena/team-mode.ts"
      - "src/lib/arena/image-models.ts"
      - "scripts/verify-models.mjs"
      - ".github/workflows/models-verify.yml"

permissions:
  contents: read

jobs:
  verify-model-catalogs:
    name: Verify text, defaults, and image catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test model verifier
        run: npm run test:models-verify

      - name: Verify public OpenRouter catalogs
        run: npm run models:verify -- --public-catalog --json
